<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遠見線上讀 產生器</title>
<meta name="description" content="輸入一個主題，自動從 29,583 篇《遠見雜誌》紙本文章中挑出 4 篇相關報導，產出可直接發送的每週導讀網頁。">
<meta property="og:title" content="遠見線上讀 產生器">
<meta property="og:description" content="輸入一個主題，自動從《遠見雜誌》紙本文章挑出 4 篇相關報導，產出每週導讀網頁。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#00479D; --blue-dark:#003B8F; --blue-light:#E8EFF7;
    --red:#CC0000; --ink:#1A1A1A; --grey:#6B7280; --line:#DDE3EC;
    --bg:#F4F6F9; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* ── 頁首 ── */
  .top{background:var(--blue);color:#fff;padding:22px 28px}
  .top-in{max-width:1400px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .logo{font-size:22px;font-weight:900;letter-spacing:.14em}
  .logo small{display:block;font-size:10px;font-weight:400;letter-spacing:.3em;opacity:.75;margin-top:5px}
  .top-note{font-size:12px;opacity:.85;font-family:var(--mono)}
  .top-note a{color:#fff}

  .shell{max-width:1400px;margin:0 auto;padding:24px 28px 60px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  @media (max-width:1080px){ .shell{grid-template-columns:1fr;padding:20px 16px 48px;gap:20px} }

  .panel{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .panel-h{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:#FBFCFE}
  .panel-h b{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--blue)}
  .panel-h .step{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;
    display:grid;place-items:center;font-weight:700;flex:none}
  .panel-h .hint{margin-left:auto;font-size:12px;color:var(--grey)}
  .panel-b{padding:20px}

  /* ── 搜尋 ── */
  .searchrow{display:flex;gap:10px;flex-wrap:wrap}
  .searchrow input[type=text]{flex:1;min-width:200px;padding:13px 16px;border:1.5px solid var(--line);border-radius:4px;font-size:16px}
  .searchrow input[type=text]:focus{border-color:var(--blue);outline:none}
  .btn-go{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:13px 26px;font-weight:700;letter-spacing:.08em}
  .btn-go:hover{background:var(--blue-dark)}
  .btn-go:disabled{background:#9AA6B4;cursor:not-allowed}
  .opts{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--grey);align-items:center}
  .opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
  .opts select{padding:5px 8px;border:1px solid var(--line);border-radius:3px;background:#fff}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
  .chip{background:var(--blue-light);color:var(--blue);border:0;border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:500}
  .chip:hover{background:var(--blue);color:#fff}
  .status{margin-top:14px;font-size:13px;color:var(--grey);font-family:var(--mono)}
  .status.err{color:var(--red)}

  /* ── 選中的四篇 ── */
  .picked{display:flex;flex-direction:column;gap:12px}
  .pick{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:5px;background:#fff}
  .pick.drag-over{border-color:var(--blue);background:var(--blue-light)}
  .pick-n{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:700;
    display:grid;place-items:center;flex:none;margin-top:2px}
  .pick-main{flex:1;min-width:0}
  .pick-t{font-size:14.5px;font-weight:700;line-height:1.5}
  .pick-t a{color:var(--ink);text-decoration:none}
  .pick-t a:hover{color:var(--blue)}
  .pick-meta{font-size:11.5px;color:var(--grey);margin-top:5px;font-family:var(--mono)}
  .pick-sum{width:100%;margin-top:9px;padding:9px 11px;border:1px solid var(--line);border-radius:4px;
    font-size:13px;line-height:1.75;resize:vertical;min-height:76px;background:#FCFDFE}
  .pick-sum:focus{border-color:var(--blue);outline:none;background:#fff}
  .pick-tools{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
  .mini{background:none;border:1px solid var(--line);border-radius:3px;padding:4px 10px;font-size:11.5px;color:var(--grey)}
  .mini:hover{border-color:var(--blue);color:var(--blue)}
  .count{font-size:11px;color:var(--grey);font-family:var(--mono);margin-left:auto}
  .count.over{color:var(--red)}

  /* ── 候選 ── */
  .cands{margin-top:16px;border-top:1px dashed var(--line);padding-top:16px}
  .cands h4{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--grey);margin-bottom:10px}
  .cand-list{max-height:330px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-right:4px}
  .cand{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:4px;
    background:#fff;text-align:left;width:100%;font-size:13px;line-height:1.5}
  .cand:hover{border-color:var(--blue);background:var(--blue-light)}
  .cand.used{opacity:.4}
  .cand-s{font-family:var(--mono);font-size:10.5px;color:var(--blue);background:var(--blue-light);
    padding:2px 6px;border-radius:3px;flex:none;margin-top:2px}
  .cand-x{flex:1;min-width:0}
  .cand-m{font-size:11px;color:var(--grey);margin-top:3px}

  /* ── 文案 ── */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--grey);margin-bottom:7px}
  .field input,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:4px;font-size:14px;line-height:1.8}
  .field input:focus,.field textarea:focus{border-color:var(--blue);outline:none}
  .field textarea{min-height:190px;resize:vertical}
  .field .row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .field .row label{margin:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:520px){ .grid2{grid-template-columns:1fr} }

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .btn2{background:#fff;color:var(--blue);border:1.5px solid var(--blue);border-radius:4px;padding:11px 18px;font-weight:500;font-size:13.5px}
  .btn2:hover{background:var(--blue);color:#fff}
  .btn1{background:var(--blue);color:#fff;border:1.5px solid var(--blue);border-radius:4px;padding:11px 22px;font-weight:700;font-size:13.5px}
  .btn1:hover{background:var(--blue-dark);border-color:var(--blue-dark)}

  /* ── 預覽 ── */
  .preview-wrap{position:sticky;top:20px}
  @media (max-width:1080px){ .preview-wrap{position:static} }
  .frame{width:100%;height:74vh;min-height:520px;border:0;background:#fff;display:block}
  @media (max-width:1080px){ .frame{height:60vh} }
  .pvbar{display:flex;gap:8px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);background:#FBFCFE;flex-wrap:wrap}
  .pvbar .seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .pvbar .seg button{background:#fff;border:0;padding:6px 13px;font-size:12px;color:var(--grey)}
  .pvbar .seg button.on{background:var(--blue);color:#fff}

  .empty{padding:48px 22px;text-align:center;color:var(--grey);font-size:14px;line-height:2}
  .empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:6px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1C2430;color:#fff;
    padding:11px 22px;border-radius:100px;font-size:13.5px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
  .toast.on{opacity:.95}

  dialog{border:0;border-radius:8px;padding:0;max-width:720px;width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(16,24,36,.55)}
  .dlg-h{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .dlg-h b{font-size:14px;letter-spacing:.1em;color:var(--blue)}
  .dlg-h button{margin-left:auto;background:none;border:0;font-size:20px;color:var(--grey);line-height:1}
  .dlg-b{padding:20px 22px 24px}
  .dlg-b p{font-size:13.5px;color:var(--grey);margin-bottom:12px;line-height:1.9}
  .dlg-b textarea{width:100%;height:280px;padding:13px;border:1px solid var(--line);border-radius:4px;
    font-family:var(--mono);font-size:12px;line-height:1.7;resize:vertical}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="logo">遠見線上讀 產生器<small>GLOBAL VIEWS WEEKLY CURATION</small></div>
    <div class="top-note"><span id="idxnote">索引載入中…</span>　·　<a href="issues/2026-08-17_AI%E6%A6%82%E5%BF%B5%E8%82%A1.html">看完成品範例</a></div>
  </div>
</header>

<div class="shell">

  <!-- 左欄：操作 -->
  <div>
    <section class="panel">
      <div class="panel-h"><span class="step">1</span><b>輸入主題</b><span class="hint">自動挑出 4 篇相關報導</span></div>
      <div class="panel-b">
        <div class="searchrow">
          <input type="text" id="kw" placeholder="例如：半導體、AI概念股、永續金融、精品消費" autocomplete="off">
          <button class="btn-go" id="go" disabled>自動選文</button>
        </div>
        <div class="opts">
          <label>年份
            <select id="since">
              <option value="0">全部 1987 起</option>
              <option value="2015">2015 起</option>
              <option value="2020">2020 起</option>
              <option value="2023" selected>2023 起</option>
              <option value="2025">2025 起</option>
            </select>
          </label>
          <label><input type="checkbox" id="recency" checked> 近期優先</label>
          <label><input type="checkbox" id="diverse" checked> 避免同一期重複</label>
        </div>
        <div class="chips" id="chips"></div>
        <div class="status" id="status"></div>
      </div>
    </section>

    <section class="panel" style="margin-top:20px">
      <div class="panel-h"><span class="step">2</span><b>選出的四篇</b><span class="hint">摘要已帶入遠見官方版本，可改</span></div>
      <div class="panel-b">
        <div id="pickedWrap">
          <div class="empty"><b>還沒有選文</b>在上面輸入一個主題，按「自動選文」</div>
        </div>
        <div class="cands" id="candsWrap" hidden>
          <h4>其他候選（點一下替換上面的第 <span id="swapTarget">1</span> 篇）</h4>
          <div class="cand-list" id="cands"></div>
        </div>
      </div>
    </section>

    <section class="panel" style="margin-top:20px">
      <div class="panel-h"><span class="step">3</span><b>文案與設定</b></div>
      <div class="panel-b">
        <div class="field">
          <label for="title">主標題</label>
          <input type="text" id="title" placeholder="按「自動選文」後會給你一個建議標題">
        </div>
        <div class="field">
          <div class="row">
            <label for="note" style="flex:1">編者的話（建議 300～500 字）</label>
            <span class="count" id="noteCount">0 字</span>
          </div>
          <textarea id="note" placeholder="寫一段貫穿四篇的觀點，讓讀者知道為什麼這四篇該一起讀。&#10;&#10;不想自己寫的話，按下面的「複製 AI 提示詞」，貼到任何 AI（ChatGPT／Gemini／Claude 都行），把回覆貼回來即可。"></textarea>
          <div class="actions" style="margin-top:10px">
            <button class="btn2" id="promptBtn">複製 AI 提示詞</button>
          </div>
        </div>
        <div class="grid2">
          <div class="field">
            <label for="campaign">UTM campaign</label>
            <input type="text" id="campaign" value="gvm_digital_AIA">
          </div>
          <div class="field">
            <label for="date">日期</label>
            <input type="date" id="date">
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- 右欄：預覽 -->
  <div class="preview-wrap">
    <section class="panel">
      <div class="panel-h"><span class="step">4</span><b>即時預覽</b><span class="hint" id="pvhint">選完文就會出現</span></div>
      <iframe class="frame" id="frame" title="預覽"></iframe>
      <div class="pvbar">
        <div class="seg">
          <button id="vwDesk" class="on">桌機</button>
          <button id="vwMob">手機</button>
        </div>
        <button class="btn2" id="copyBtn">複製 HTML</button>
        <button class="btn1" id="dlBtn">下載網頁</button>
      </div>
    </section>
  </div>

</div>

<dialog id="dlg">
  <div class="dlg-h"><b>AI 提示詞</b><button id="dlgX" aria-label="關閉">×</button></div>
  <div class="dlg-b">
    <p>已經幫你把四篇文章的真實標題、期別與官方摘要組進去了。貼到任何 AI，把回覆貼回「編者的話」欄位即可。因為資料都在提示詞裡，AI 只負責寫文案、不需要自己查資料，所以不會編造內容。</p>
    <textarea id="dlgTxt" readonly></textarea>
    <div class="actions" style="margin-top:12px">
      <button class="btn1" id="dlgCopy">複製到剪貼簿</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ═══ 常數 ═══════════════════════════════════════════════════════════════
  var BRAND = { blue:'#00479D', blueDark:'#003B8F', blueLight:'#E8EFF7', ink:'#1A1A1A', grey:'#6B7280', line:'#DDE3EC' };
  var FIELD_WEIGHT = { t:3.0, e:2.2, m:1.2, s:0.6, a:0.4 };  // 標題/摘要/期主題/分類/作者
  var HALF_LIFE = 18;   // 近期加權半衰期（月）
  var PICK_N = 4;

  // 語意擴詞表：涵蓋遠見主要客戶產業。輸入詞命中任一 key 就把整組詞帶進來。
  var SYNONYMS = {
    'AI':['AI','人工智慧','生成式','大模型','演算法','機器學習','智慧','GPT','算力'],
    '半導體':['半導體','晶片','晶圓','台積電','先進封裝','製程','IC','矽','記憶體'],
    '概念股':['概念股','個股','台股','類股','漲','股價','市值'],
    '投資':['投資','理財','資產','報酬','布局','配置','ETF','基金','股市','台股'],
    '金融':['金融','銀行','保險','壽險','證券','金控','支付','資產管理','財富'],
    '永續':['永續','ESG','淨零','碳','減碳','綠能','循環','氣候','轉型'],
    '能源':['能源','電力','綠電','核能','太陽能','風電','電網','儲能'],
    '零售':['零售','百貨','電商','消費','通路','品牌','門市','餐飲'],
    '精品':['精品','鐘錶','奢侈品','珠寶','名錶','高端','時尚'],
    '製造':['製造','傳產','工廠','供應鏈','產線','自動化','機械','數位轉型'],
    '人才':['人才','招募','人力','育才','教育','大學','技職','職場','世代'],
    '醫療':['醫療','健康','長照','生技','醫院','新藥','照護','高齡'],
    '房地產':['房地產','房價','建商','都更','居住','營建','不動產'],
    '國際':['國際','全球','地緣','美中','關稅','貿易','川普','出海'],
    '科技':['科技','電子','網通','軟體','雲端','資安','機器人','量子'],
    '觀光':['觀光','旅遊','飯店','航空','餐旅','文化','城市']
  };

  // ═══ 狀態 ═══════════════════════════════════════════════════════════════
  var DATA = null, IMG_PREFIX = '';
  var picked = [];        // 目前選中的四篇（含 summary）
  var pool = [];          // 目前搜尋的候選池（已排序）
  var swapIndex = 0;      // 候選清單點擊時要替換第幾篇

  // ═══ 小工具 ═════════════════════════════════════════════════════════════
  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function chars(s){ return String(s||'').replace(/\s/g,'').length; }
  function imgUrl(g){ return !g ? '' : (/^https?:/.test(g) ? g : IMG_PREFIX + g); }
  function artUrl(id){ return 'https://www.gvm.com.tw/article/' + id; }

  var toastTimer;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2000);
  }

  function copyText(text, okMsg){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast(okMsg); },
        function(){ fallbackCopy(text, okMsg); });
    } else { fallbackCopy(text, okMsg); }
  }
  function fallbackCopy(text, okMsg){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(okMsg); }
    catch(e){ toast('複製失敗，請手動選取'); }
    ta.remove();
  }

  // ═══ 檢索 ═══════════════════════════════════════════════════════════════
  function expand(input){
    var raw = String(input||'').trim();
    if (!raw) return [];
    var terms = [raw];
    var lower = raw.toLowerCase();
    Object.keys(SYNONYMS).forEach(function(key){
      if (lower.indexOf(key.toLowerCase()) !== -1 || key.toLowerCase().indexOf(lower) !== -1) {
        SYNONYMS[key].forEach(function(t){ if (terms.indexOf(t) === -1) terms.push(t); });
      }
    });
    // 沒命中同義詞表，且是較長的中文詞 → 拆成 2 字片語當弱關鍵詞
    if (terms.length === 1 && raw.length >= 4 && /[一-鿿]/.test(raw)) {
      for (var i = 0; i + 2 <= raw.length; i++) {
        var bi = raw.substr(i, 2);
        if (/[一-鿿]{2}/.test(bi) && terms.indexOf(bi) === -1) terms.push(bi);
      }
    }
    return terms;
  }

  function hits(hay, term){
    if (!hay || !term) return 0;
    var h = hay.toLowerCase(), t = term.toLowerCase(), n = 0, i = 0;
    while ((i = h.indexOf(t, i)) !== -1) { n++; i += t.length; }
    return n;
  }

  function recency(rec){
    var y = parseInt(rec.y.slice(0,4), 10), m = parseInt(rec.y.slice(5,7), 10) || 6;
    if (!y) return 0.5;
    var now = new Date();
    var age = (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m);
    if (age <= 0) return 1;
    return 0.15 + 0.85 * Math.pow(0.5, age / HALF_LIFE);
  }

  function search(input, opts){
    var terms = expand(input);
    if (!terms.length) return { terms: [], results: [] };
    var out = [];
    for (var k = 0; k < DATA.length; k++) {
      var r = DATA[k];
      if (opts.since && parseInt(r.y.slice(0,4),10) < opts.since) continue;
      var raw = 0, matched = 0;
      for (var j = 0; j < terms.length; j++) {
        var term = terms[j], ts = 0;
        for (var f in FIELD_WEIGHT) {
          var c = hits(r[f], term);
          if (c) ts += FIELD_WEIGHT[f] * Math.min(c, 3);
        }
        // 原始輸入詞給額外權重，避免被擴充詞稀釋
        if (j === 0) ts *= 1.6;
        if (ts > 0) { raw += ts; matched++; }
      }
      if (raw <= 0) continue;
      var breadth = 1 + 0.3 * (matched - 1);
      var score = raw * breadth * (opts.recency ? recency(r) : 1);
      out.push({ rec: r, score: score });
    }
    out.sort(function(a,b){ return b.score - a.score; });
    return { terms: terms, results: out };
  }

  // 自動挑 N 篇：分數優先，但避免同一期擠滿版面
  function autoPick(results, n, diverse){
    var chosen = [], usedIssue = {}, usedSection = {};
    function key(r){ return r.y + '|' + r.m; }
    if (diverse) {
      for (var i = 0; i < results.length && chosen.length < n; i++) {
        var r = results[i].rec;
        if (usedIssue[key(r)]) continue;
        if (usedSection[r.s] >= 2) continue;
        chosen.push(r); usedIssue[key(r)] = 1;
        usedSection[r.s] = (usedSection[r.s] || 0) + 1;
      }
    }
    // 不夠就放寬條件補滿
    for (var j = 0; j < results.length && chosen.length < n; j++) {
      var rr = results[j].rec;
      if (chosen.indexOf(rr) === -1) chosen.push(rr);
    }
    return chosen;
  }

  // ═══ AI 提示詞 ═══════════════════════════════════════════════════════════

             '   遠見官方摘要：' + (p.summary || '（無）');

      '本週選出的四篇紙本報導如下（資料皆為真實，請勿更動標題或出處）：\n\n' + lines + '\n\n' +

      '4. 用繁體中文台灣用語。用空行分段，約三到五段。\n' +
      '5. 只輸出編者的話本文，不要加標題、不要加開場白、不要說明你做了什麼。';
  }

  // ═══ 事件 ═══════════════════════════════════════════════════════════════
  function doSearch(){
    var kw = $('kw').value.trim();
    if (!kw) { $('status').textContent = '請先輸入一個主題'; $('status').className = 'status err'; return; }
    var opts = {
      since: parseInt($('since').value, 10) || 0,
      recency: $('recency').checked
    };
    var res = search(kw, opts);
    pool = res.results;

    if (!pool.length) {
      $('status').className = 'status err';
      $('status').textContent = '沒有找到相關紙本文章，換個說法或把年份放寬';
      return;
    }

    var chosen = autoPick(pool, PICK_N, $('diverse').checked);
    picked = chosen.map(function(r){
      var o = {};
      for (var k in r) o[k] = r[k];
      o.summary = r.e || '';   // 預填遠見官方摘要，真實內容
      return o;
    });

    if (!$('title').value.trim()) $('title').value = kw + '：本週四篇《遠見》紙本精選';

    $('status').className = 'status';
    $('status').textContent = '索引 ' + DATA.length.toLocaleString() + ' 篇｜命中 ' + pool.length +
      ' 篇｜擴充關鍵詞：' + res.terms.slice(0, 8).join('、') + (res.terms.length > 8 ? '…' : '');

    var noSum = picked.filter(function(p){ return !p.summary; }).length;
    renderPicked(); renderCands(); refreshPreview();
    if (noSum) toast('已選 4 篇，其中 ' + noSum + ' 篇沒有官方摘要，請自行補寫');
    else toast('已選出 4 篇');
  }

  function bind(){
    $('go').addEventListener('click', doSearch);
    $('kw').addEventListener('keydown', function(e){ if (e.key === 'Enter') doSearch(); });

    // 熱門主題
    var CHIPS = ['半導體','AI概念股','永續金融','高齡社會','人才育才','能源轉型','零售消費','地緣政治'];
    $('chips').innerHTML = CHIPS.map(function(c){ return '<button class="chip">' + c + '</button>'; }).join('');
    $('chips').addEventListener('click', function(e){
      var b = e.target.closest('.chip'); if (!b) return;
      $('kw').value = b.textContent; doSearch();
    });

    // 選中四篇的操作
    $('pickedWrap').addEventListener('input', function(e){
      var ta = e.target.closest('.pick-sum'); if (!ta) return;
      var i = +ta.dataset.i;
      picked[i].summary = ta.value;
      var c = document.querySelector('[data-c="' + i + '"]');
      if (c) { c.textContent = chars(ta.value) + ' 字'; c.className = 'count' + (chars(ta.value) > 170 ? ' over' : ''); }
      refreshPreview();
    });
    $('pickedWrap').addEventListener('click', function(e){
      var b = e.target.closest('[data-act]'); if (!b) return;
      var i = +b.dataset.i, act = b.dataset.act;
      if (act === 'swap') {
        swapIndex = i; $('swapTarget').textContent = i + 1;
        $('candsWrap').scrollIntoView({ behavior:'smooth', block:'nearest' });
        toast('點下方任一篇，替換第 ' + (i+1) + ' 篇');
      } else if (act === 'up' && i > 0) {
        var t = picked[i-1]; picked[i-1] = picked[i]; picked[i] = t;
        renderPicked(); refreshPreview();
      } else if (act === 'down' && i < picked.length - 1) {
        var t2 = picked[i+1]; picked[i+1] = picked[i]; picked[i] = t2;
        renderPicked(); refreshPreview();
      }
    });

    // 候選替換
    $('cands').addEventListener('click', function(e){
      var b = e.target.closest('.cand'); if (!b) return;
      var id = +b.dataset.id;
      if (picked.some(function(p){ return p.i === id; })) { toast('這篇已經在名單裡了'); return; }
      var rec = null;
      for (var i = 0; i < pool.length; i++) if (pool[i].rec.i === id) { rec = pool[i].rec; break; }
      if (!rec) return;
      var o = {}; for (var k in rec) o[k] = rec[k];
      o.summary = rec.e || '';
      picked[swapIndex] = o;
      renderPicked(); renderCands(); refreshPreview();
      toast('已替換第 ' + (swapIndex + 1) + ' 篇');
    });

    // 文案
    $('note').addEventListener('input', function(){
      var n = chars(this.value);
      var el = $('noteCount');
      el.textContent = n + ' 字';
      el.className = 'count' + ((n && (n < 300 || n > 500)) ? ' over' : '');
      refreshPreview();
    });
    ['title','campaign','date'].forEach(function(id){
      $(id).addEventListener('input', refreshPreview);
    });

    // AI 提示詞
    $('promptBtn').addEventListener('click', function(){
      if (!picked.length) { toast('請先選文'); return; }
      $('dlgTxt').value = buildPrompt();
      $('dlg').showModal();
    });
    $('dlgX').addEventListener('click', function(){ $('dlg').close(); });
    $('dlgCopy').addEventListener('click', function(){ copyText($('dlgTxt').value, '已複製，貼到任何 AI 即可'); });

    // 預覽切換
    $('vwDesk').addEventListener('click', function(){
      $('frame').style.maxWidth = '100%'; $('vwDesk').classList.add('on'); $('vwMob').classList.remove('on');
    });
    $('vwMob').addEventListener('click', function(){
      $('frame').style.maxWidth = '390px'; $('vwMob').classList.add('on'); $('vwDesk').classList.remove('on');
    });

    // 匯出
    $('dlBtn').addEventListener('click', function(){
      if (!picked.length) { toast('請先選文'); return; }
      var d = $('date').value || new Date().toISOString().slice(0,10);
      var slug = ($('kw').value || 'weekly').replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 24);
      var blob = new Blob([buildPage()], { type: 'text/html;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = d + '_' + slug + '.html';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('已下載');
    });
    $('copyBtn').addEventListener('click', function(){
      if (!picked.length) { toast('請先選文'); return; }
      copyText(buildPage(), '整份 HTML 已複製');
    });
  }

  // ═══ 啟動 ═══════════════════════════════════════════════════════════════
  $('date').value = new Date().toISOString().slice(0, 10);

  fetch('data/index.json')
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      DATA = j.articles; IMG_PREFIX = j.imgPrefix || '';
      var years = DATA.map(function(r){ return r.y.slice(0,4); }).filter(Boolean).sort();
      $('idxnote').textContent = DATA.length.toLocaleString() + ' 篇紙本文章 · ' + years[0] + '–' + years[years.length-1];
      $('go').disabled = false;
      $('status').textContent = '索引已就緒，輸入主題即可開始';
      bind();
    })
    .catch(function(e){
      $('idxnote').textContent = '索引載入失敗';
      $('status').className = 'status err';
      $('status').textContent = '索引載入失敗：' + e.message + '（請重新整理）';
    });
})();
</script>
